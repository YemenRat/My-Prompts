<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YemenRat | معرض الأوامر الذكية</title>
    <style>
        :root { --primary: #3b82f6; --bg: #0f172a; --card-bg: #1e293b; --text: #f8fafc; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        header { text-align: center; margin-bottom: 40px; }
        .search-box { display: flex; flex-direction: column; align-items: center; gap: 15px; margin-bottom: 40px; }
        input { padding: 12px 25px; border-radius: 30px; border: 1px solid #475569; width: 100%; max-width: 500px; background: #334155; color: white; outline: none; }
        .filters { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .filter-btn { padding: 8px 20px; border-radius: 20px; border: 1px solid #334155; background: transparent; color: #94a3b8; cursor: pointer; transition: 0.3s; }
        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .card { background: var(--card-bg); border-radius: 16px; overflow: hidden; transition: 0.3s; border: 1px solid #334155; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-10px); }
        .card-img { width: 100%; height: 200px; object-fit: cover; background: #111; }
        .card-content { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; }
        .card-tag { font-size: 0.7rem; background: #334155; padding: 4px 10px; border-radius: 5px; color: var(--primary); font-weight: bold; width: fit-content; }
        .card-title { margin: 10px 0; font-size: 1.1rem; color: #fff; }
        .prompt-preview { font-size: 0.8rem; color: #94a3b8; background: #0f172a; padding: 10px; border-radius: 8px; margin-bottom: 15px; height: 45px; overflow-y: auto; }
        .copy-btn { width: 100%; padding: 12px; border: none; border-radius: 10px; background: var(--primary); color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎨 YemenRat Prompts Gallery</h1>
        <p style="color: #94a3b8;">معرض أوامر متطابق مع الصور</p>
    </header>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="ابحث عن (أسد، قط، فضاء)...">
        <div class="filters">
            <button class="filter-btn active" onclick="filterData('الكل')">الكل</button>
            <button class="filter-btn" onclick="filterData('واقعي')">واقعي</button>
            <button class="filter-btn" onclick="filterData('كرتوني')">كرتوني</button>
            <button class="filter-btn" onclick="filterData('فضاء')">فضاء</button>
        </div>
    </div>

    <div id="mainGrid" class="grid"></div>
</div>

<script>
    // بيانات دقيقة ومختارة
    const promptsData = [
        { category: "واقعي", title: "أسد أفريقي مهيب", text: "Majestic African lion, cinematic lighting, 8k, hyper-detailed fur.", keyword: "lion" },
        { category: "واقعي", title: "نمر في الغابة", text: "Tiger in the jungle, raining, high detail, realistic textures.", keyword: "tiger" },
        { category: "واقعي", title: "حصان أبيض سريع", text: "White horse running on beach, water splashes, sunset lighting.", keyword: "white-horse" },
        { category: "واقعي", title: "بومة في الليل", text: "Owl eyes close up, night forest, soft moonlight, sharp focus.", keyword: "owl" },
        { category: "كرتوني", title: "ثعلب بأسلوب بيكسار", text: "Cute baby fox, 3D render, Pixar style, soft colors, big eyes.", keyword: "fox-cartoon" },
        { category: "فضاء", title: "رائد فضاء على المريخ", text: "Astronaut on Mars, red dust, futuristic suit, cinematic stars.", keyword: "astronaut" },
        { category: "فضاء", title: "مجرة ملونة", text: "Nebula galaxy, vibrant colors, cosmic dust, deep space, 8k.", keyword: "galaxy" },
        { category: "واقعي", title: "قط سيامي لطيف", text: "Siamese cat, blue eyes, sitting on carpet, indoor lighting.", keyword: "siamese-cat" },
        { category: "واقعي", title: "عقاب في السماء", text: "Eagle flying, blue sky, wide wings, professional photography.", keyword: "eagle" },
        { category: "كرتوني", title: "تنين صغير سحري", text: "Little baby dragon, fire breath, 3D character design, cute.", keyword: "dragon" }
    ];

    // توليد 100 أمر مع ضمان مطابقة الصورة للكلمة الدلالية
    const fullData = [];
    for(let i=0; i<100; i++) {
        let base = promptsData[i % promptsData.length];
        fullData.push({
            ...base,
            title: `${base.title} #${i+1}`,
            // استخدام رابط خدمة الصور بناءً على الكلمة الدلالية لضمان المطابقة
            img: `https://source.unsplash.com/featured/?${base.keyword}&sig=${i}`
        });
    }

    function render(data) {
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = data.map(p => `
            <div class="card">
                <img src="${p.img}" class="card-img" alt="Prompt Image">
                <div class="card-content">
                    <span class="card-tag">${p.category}</span>
                    <h3 class="card-title">${p.title}</h3>
                    <div class="prompt-preview">${p.text}</div>
                    <button class="copy-btn" onclick="copyText('${p.text}', this)">نسخ الأمر 📋</button>
                </div>
            </div>
        `).join('');
    }

    // نفس وظائف الفلترة والبحث السابقة
    function filterData(cat) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        const filtered = cat === 'الكل' ? fullData : fullData.filter(p => p.category === cat);
        render(filtered);
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = fullData.filter(p => p.title.toLowerCase().includes(term) || p.text.toLowerCase().includes(term));
        render(filtered);
    });

    function copyText(text, btn) {
        navigator.clipboard.writeText(text);
        btn.innerText = "تم النسخ! ✓";
        btn.style.background = "#10b981";
        setTimeout(() => { btn.innerText = "نسخ الأمر 📋"; btn.style.background = "#3b82f6"; }, 2000);
    }

    render(fullData);
</script>
</body>
</html>
