<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة الأوامر الاحترافية</title>
    <style>
        /* التنسيقات الأساسية */
        :root { --primary: #3b82f6; --bg: #f1f5f9; --text: #1e293b; }
        body { font-family: 'Segoe UI', system-ui; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        
        /* شريط البحث والتصنيفات */
        .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 30px; justify-content: center; }
        input[type="text"] { padding: 10px 20px; border-radius: 25px; border: 1px solid #ddd; width: 300px; outline: none; }
        .filter-btn { padding: 8px 18px; border-radius: 20px; border: none; background: #fff; cursor: pointer; transition: 0.3s; }
        .filter-btn.active { background: var(--primary); color: white; }

        /* شبكة البطاقات */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: white; padding: 15px; border-radius: 15px; border-bottom: 4px solid var(--primary); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .tag { font-size: 0.7em; background: #e2e8f0; padding: 3px 8px; border-radius: 10px; color: #64748b; }
        .prompt-box { background: #f8fafc; padding: 12px; border-radius: 10px; margin: 10px 0; font-family: monospace; font-size: 0.85em; }
        .copy-btn { width: 100%; padding: 10px; border: none; border-radius: 8px; background: var(--primary); color: white; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="text-align:center">🚀 منصة الأوامر الذكية</h1>
    
    <div class="controls">
        <input type="text" id="searchInput" placeholder="ابحث عن أمر معين...">
        <button class="filter-btn active" onclick="filterData('الكل')">الكل</button>
        <button class="filter-btn" onclick="filterData('واقعي')">واقعي</button>
        <button class="filter-btn" onclick="filterData('كرتوني')">كرتوني</button>
        <button class="filter-btn" onclick="filterData('حيوانات')">حيوانات</button>
    </div>

    <div class="grid" id="mainGrid"></div>
</div>

<script>
    // مصفوفة البيانات (يمكنك إضافة الـ 350 أمراً هنا)
    const allPrompts = [
        { category: "واقعي", title: "قط سيامي بأسلوب سينمائي", text: "Cinematic portrait of a Siamese cat, golden hour, 8k resolution, hyper-realistic." },
        { category: "كرتوني", title: "كلب صغير بأسلوب بيكسار", text: "Cute puppy in Pixar style, 3D render, vibrant colors, soft lighting." },
        { category: "حيوانات", title: "صقر في الصحراء", text: "Eagle flying over Sahara desert, National Geographic photography style, high speed shutter." }
        // أضف المزيد هنا...
    ];

    function renderPrompts(data) {
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = data.map(p => `
            <div class="card">
                <span class="tag">${p.category}</span>
                <h3>${p.title}</h3>
                <div class="prompt-box">${p.text}</div>
                <button class="copy-btn" onclick="copyText('${p.text}', this)">نسخ الأمر</button>
            </div>
        `).join('');
    }

    // وظيفة الفلترة والبحث
    function filterData(cat) {
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        const filtered = cat === 'الكل' ? allPrompts : allPrompts.filter(p => p.category === cat);
        renderPrompts(filtered);
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = allPrompts.filter(p => p.text.toLowerCase().includes(term) || p.title.toLowerCase().includes(term));
        renderPrompts(filtered);
    });

    function copyText(text, btn) {
        navigator.clipboard.writeText(text);
        btn.innerText = "تم النسخ!";
        setTimeout(() => btn.innerText = "نسخ الأمر", 2000);
    }

    // التشغيل الأولي
    renderPrompts(allPrompts);
</script>
</body>
</html>
